services:
  - type: web
    name: laikipia-backend
    env: python
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi --log-file -
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: laikipia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://laikipia-west-frontend.vercel.app,https://kuriaforgovernor.co.ke,https://www.kuriaforgovernor.co.ke,http://kuriaforgovernor.co.ke"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://laikipia-west-frontend.vercel.app,https://kuriaforgovernor.co.ke,https://www.kuriaforgovernor.co.ke"
      
databases:
  - name: laikipia-db
    databaseName: laikipiadb
    user: laikipia
    region: frankfurt
