services:
  - type: web
    name: laikipia-backend
    env: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python create_users.py && python manage.py sync_master_voters
    startCommand: gunicorn core.wsgi --log-file -
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: laikipia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,https://laikipia-frontend.vercel.app,https://ol-kalou-frontend.vercel.app"
      
databases:
  - name: laikipia-db
    databaseName: laikipiadb
    user: laikipia
    region: frankfurt
